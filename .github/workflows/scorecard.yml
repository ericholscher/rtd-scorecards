name: Scorecard scan

on:
  schedule:
    # Every Monday at 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  SCORECARD_VERSION: 5.5.0

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install scorecard
        run: |
          curl -sSfL -o scorecard.tar.gz "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          tar -xzf scorecard.tar.gz scorecard
          rm scorecard.tar.gz

      - name: Scan repos
        env:
          # A SCORECARD_TOKEN secret (classic PAT, public_repo scope) takes
          # precedence over the workflow token if API rate limits become a problem.
          GITHUB_AUTH_TOKEN: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          while IFS= read -r repo; do
            case "$repo" in
              ""|"#"*) continue ;;
            esac
            name=$(basename "$repo")
            echo "::group::${repo}"
            if ! ./scorecard --repo="github.com/${repo}" --format=json > "results/${name}.json"; then
              echo "::warning::Scan failed for ${repo}"
              rm -f "results/${name}.json"
            fi
            echo "::endgroup::"
          done < repos.txt

      - name: Build report
        run: |
          python3 scripts/report.py --results results --readme README.md
          python3 scripts/report.py --results results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results/

      - name: Commit scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Scoreboard unchanged"
          else
            git commit -m "Update scoreboard $(date -u +%Y-%m-%d)"
            git push
          fi
